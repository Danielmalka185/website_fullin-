<section id="ways" class="w-section" aria-labelledby="ways-title">
  <div class="container">
    <header class="s-head reveal">
      <p class="eyebrow" data-i18n="ways.eyebrow">דרכים לעבוד איתנו</p>

      <p class="s-sub" data-i18n="ways.sub"></p>
    </header>

    <ul class="w-cards" role="list">
      <li class="w-card reveal" id="way-host" data-delay="0">
        <div class="w-media">
          <img src="assets/venues/bar-real.webp" width="1000" height="1333" loading="lazy" decoding="async" alt="" data-i18n-attr="alt:ways.cards.0.alt" style="object-position:50% 58%">
        </div>
        <div class="w-body">
          <span class="w-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M12 9.5v6M9 12.5h6" /></svg></span>
          <p class="w-tag" data-i18n="ways.cards.0.tag"></p>
          <h3 class="w-title" data-i18n="ways.cards.0.title"></h3>
          <p class="w-text" data-i18n="ways.cards.0.text"></p>
          <ul class="w-list" role="list">
            <li data-i18n="ways.cards.0.bullets.0"></li>
            <li data-i18n="ways.cards.0.bullets.1"></li>
            <li data-i18n="ways.cards.0.bullets.2"></li>
          </ul>
          <a class="btn btn--primary w-cta" href="#contact" data-way="hosting" data-i18n="ways.cards.0.cta" data-i18n-attr="aria-label:ways.cards.0.ctaAria"></a>
        </div>
      </li>

      <li class="w-card w-card--feat reveal" id="way-rent" data-delay="1">
        <div class="w-media w-media--stage">
          <span class="w-new" data-i18n="ways.badgeNew">חדש</span>
          <img class="w-st w-st--24" src="assets/retouched/station-24.webp" width="591" height="2476" loading="lazy" decoding="async" alt="" data-i18n-attr="alt:ways.cards.1.alt">
          <img class="w-st w-st--6" src="assets/retouched/station-6.webp" width="1501" height="1576" loading="lazy" decoding="async" alt="">
          <svg class="w-ring" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 7"/><circle cx="100" cy="100" r="66" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 9"/></svg>
        </div>
        <div class="w-body">
          <span class="w-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.5 17.5a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.2-.5-.5-2.2 2.7-2.3Z"/></svg></span>
          <p class="w-tag" data-i18n="ways.cards.1.tag"></p>
          <h3 class="w-title" data-i18n="ways.cards.1.title"></h3>
          <p class="w-text" data-i18n="ways.cards.1.text"></p>
          <ul class="w-list" role="list">
            <li data-i18n="ways.cards.1.bullets.0"></li>
            <li data-i18n="ways.cards.1.bullets.1"></li>
            <li data-i18n="ways.cards.1.bullets.2"></li>
          </ul>
          <p class="w-note"><span class="w-chip" data-i18n="ways.priceChip"></span> <span data-i18n="ways.rentNote"></span></p>
          <a class="btn btn--primary w-cta" href="#contact" data-way="rental" data-i18n="ways.cards.1.cta" data-i18n-attr="aria-label:ways.cards.1.ctaAria"></a>
        </div>
      </li>

      <li class="w-card reveal" id="way-event" data-delay="2">
        <div class="w-media w-media--night">
          <img src="assets/curated/festival/powerbank-pile-by-station.webp" width="1086" height="1448" loading="lazy" decoding="async" alt="" data-i18n-attr="alt:ways.cards.2.alt" style="object-position:50% 70%">
          <svg class="w-lights" viewBox="0 0 400 60" preserveAspectRatio="none" role="img" aria-hidden="true" focusable="false"><path d="M-5 8 Q50 42 100 14 T200 14 T300 14 T405 8" fill="none" stroke="rgba(14,21,18,.55)" stroke-width="1.4"/><g class="w-bulbs"><circle cx="24" cy="27" r="5"/><circle cx="62" cy="31" r="5"/><circle cx="100" cy="15" r="5"/><circle cx="138" cy="26" r="5"/><circle cx="176" cy="30" r="5"/><circle cx="214" cy="23" r="5"/><circle cx="252" cy="16" r="5"/><circle cx="290" cy="22" r="5"/><circle cx="328" cy="30" r="5"/><circle cx="366" cy="25" r="5"/></g></svg>
        </div>
        <div class="w-body">
          <span class="w-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.9 9l5.6.2-4.4 3.5 1.6 5.5L12 15l-4.7 3.2 1.6-5.5L4.500 9.200 10.100 9 12 3.500Z"/><path d="M19.500 3.500v3M18 5h3M4.500 18.500v2.500M3.300 19.700h2.400"/></svg></span>
          <p class="w-tag" data-i18n="ways.cards.2.tag"></p>
          <h3 class="w-title" data-i18n="ways.cards.2.title"></h3>
          <p class="w-text" data-i18n="ways.cards.2.text"></p>
          <ul class="w-list" role="list">
            <li data-i18n="ways.cards.2.bullets.0"></li>
            <li data-i18n="ways.cards.2.bullets.1"></li>
            <li data-i18n="ways.cards.2.bullets.2"></li>
          </ul>
          <a class="btn btn--primary w-cta" href="#contact" data-way="event" data-i18n="ways.cards.2.cta" data-i18n-attr="aria-label:ways.cards.2.ctaAria"></a>

      </li>

    <div class="w-guide reveal" aria-labelledby="ways-guide-title">
      <h3 class="w-guide__title" id="ways-guide-title" data-i18n="ways.guideTitle"></h3>
      <ul class="w-guide__rows" role="list">
        <li><span class="w-guide__q" data-i18n="ways.guide.0.q"></span><a class="w-guide__a" href="#way-host" data-i18n="ways.guide.0.a"></a></li>
        <li><span class="w-guide__q" data-i18n="ways.guide.1.q"></span><a class="w-guide__a" href="#way-rent" data-i18n="ways.guide.1.a"></a></li>
        <li><span class="w-guide__q" data-i18n="ways.guide.2.q"></span><a class="w-guide__a" href="#way-event" data-i18n="ways.guide.2.a"></a></li>
      </ul>
    </div>
  </div>
</section>
