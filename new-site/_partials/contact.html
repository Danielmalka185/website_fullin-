<section id="contact" class="s-section s-contact" aria-labelledby="contact-title">
  <div class="container">
    <header class="s-head reveal">
      <p class="eyebrow" data-i18n="contact.eyebrow">צור קשר</p>
      <h2 class="s-title" id="contact-title" data-i18n="contact.title"></h2>
      <p class="s-sub" data-i18n="contact.sub"></p>
    </header>
    <div class="s-contact__grid">
      <form class="s-form s-card reveal" id="lead-form" novalidate>
        <div class="s-field">
          <label for="lf-name" data-i18n="contact.form.name"></label>
          <input id="lf-name" name="name" type="text" autocomplete="name" required aria-describedby="lf-name-err">
          <p class="s-err" id="lf-name-err" role="alert" hidden></p>
        </div>
        <div class="s-field">
          <label for="lf-business" data-i18n="contact.form.business"></label>
          <input id="lf-business" name="business" type="text" autocomplete="organization" required aria-describedby="lf-business-err">
          <p class="s-err" id="lf-business-err" role="alert" hidden></p>
        </div>
        <div class="s-field">
          <label for="lf-type" data-i18n="contact.form.type"></label>
          <div class="s-select">
            <select id="lf-type" name="type" required aria-describedby="lf-type-err">
              <option value="" data-x="sections.selectPlaceholder">בחרו סוג עסק</option>
              <option value="0" data-i18n="contact.form.typeOptions.0"></option>
              <option value="1" data-i18n="contact.form.typeOptions.1"></option>
              <option value="2" data-i18n="contact.form.typeOptions.2"></option>
              <option value="3" data-i18n="contact.form.typeOptions.3"></option>
              <option value="4" data-i18n="contact.form.typeOptions.4"></option>
              <option value="5" data-i18n="contact.form.typeOptions.5"></option>
              <option value="6" data-i18n="contact.form.typeOptions.6"></option>
            </select>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <p class="s-err" id="lf-type-err" role="alert" hidden></p>
        </div>
        <div class="s-field s-field--half">
          <label for="lf-phone" data-i18n="contact.form.phone"></label>
          <input id="lf-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" required aria-describedby="lf-phone-err" class="s-input--ltr">
          <p class="s-err" id="lf-phone-err" role="alert" hidden></p>
        </div>
        <div class="s-field s-field--half">
          <label for="lf-city" data-i18n="contact.form.city"></label>
          <input id="lf-city" name="city" type="text" autocomplete="address-level2" required aria-describedby="lf-city-err">
          <p class="s-err" id="lf-city-err" role="alert" hidden></p>
        </div>
        <button type="submit" class="btn btn--primary s-form__submit">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.4.1.1.1.6-.1 1.2Z"/></svg>
          <span data-i18n="contact.form.submit"></span>
        </button>
        <p class="s-success" id="lf-success" role="status" aria-live="polite" hidden data-i18n="contact.successNote"></p>
      </form>

      <div class="s-contact__side">
        <div class="s-card s-wa reveal">
          <p data-i18n="contact.whatsapp"></p>
          <a class="btn s-wa__btn" href="https://wa.me/972542780713" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.4.1.1.1.6-.1 1.2Z"/></svg>
            <span dir="ltr">WhatsApp · 054-278-0713</span>
          </a>
        </div>
        <div class="s-card s-app reveal">
          <p data-i18n="contact.appTitle"></p>
          <div class="s-badges">
            <a class="s-badge-btn" href="https://apps.apple.com/il/app/fullin/id6757767367?l=he" target="_blank" rel="noopener" lang="en">
              <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor"><path d="M16.4 12.7c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.500-.2-2.900.9-3.700.9-.8 0-1.900-.9-3.200-.8-1.600 0-3.100 1-4 2.400-1.700 3-.4 7.400 1.200 9.800.8 1.200 1.800 2.500 3 2.400 1.200 0 1.700-.8 3.200-.8 1.500 0 1.900.8 3.200.8 1.300 0 2.200-1.200 3-2.400.9-1.400 1.300-2.700 1.300-2.800-.1 0-2.600-1-2.600-4Zm-2.400-7c.7-.8 1.100-1.900 1-3-1 0-2.100.6-2.800 1.400-.6.700-1.200 1.800-1 2.900 1 .1 2.100-.5 2.800-1.300Z"/></svg>
              <span class="s-badge-btn__t"><small dir="ltr">Download on the</small><b dir="ltr">App Store</b></span>
            </a>
            <a class="s-badge-btn" href="https://play.google.com/store/apps/details?id=com.fullin.app" target="_blank" rel="noopener" lang="en">
              <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="#2FC353" d="M3.600 2.500 13.500 12 3.600 21.500a1.600 1.600 0 0 1-.4-1.100V3.600c0-.4.100-.8.400-1.100Z"/><path fill="#E8F23A" d="m17 8.500-3.500 3.500L17 15.500l3.800-2.100c1.100-.7 1.100-2.200 0-2.800L17 8.500Z"/><path fill="#fff" d="M3.600 2.500c.4-.4 1-.5 1.600-.2L17 8.500 13.500 12 3.600 2.500Z"/><path fill="#8b9a93" d="M3.600 21.500 13.500 12 17 15.500 5.200 21.700c-.6.300-1.200.2-1.600-.2Z"/></svg>
              <span class="s-badge-btn__t"><small dir="ltr">GET IT ON</small><b dir="ltr">Google Play</b></span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
