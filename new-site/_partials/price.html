<section class="section price" id="price" aria-labelledby="price-title">
  <div class="glow-orb price__orb" aria-hidden="true"></div>
  <div class="container">
    <header class="section-head">
      <p class="eyebrow reveal" data-i18n="price.eyebrow">מחיר</p>
      <h2 class="h-section reveal" data-delay="1" id="price-title" tabindex="-1" data-i18n="price.title"></h2>
      <p class="lead reveal" data-delay="2" data-i18n="price.sub"></p>
    </header>
    <div class="ptl" data-progress>
      <div class="ptl__track" aria-hidden="true"><i class="ptl__fill"></i></div>
      <ol class="ptl__list" role="list">
      <li class="pstep pstep--free reveal" data-delay="1">
        <span class="pstep__node" aria-hidden="true"><b>1</b></span>
        <div class="pstep__body">
          <p class="pstep__label"><span data-i18n="price.steps.0.label"></span> <span class="pstep__badge" data-i18n="price.steps.0.badge"></span></p>
          <p class="pstep__amount" data-i18n="price.steps.0.amount"></p>
          <p class="pstep__text" data-i18n="price.steps.0.text"></p>
        </div>
      </li>
      <li class="pstep pstep--rate reveal" data-delay="2">
        <span class="pstep__node" aria-hidden="true"><b>2</b></span>
        <div class="pstep__body">
          <p class="pstep__label" data-i18n="price.steps.1.label"></p>
          <p class="pstep__amount" data-i18n="price.steps.1.amount"></p>
          <p class="pstep__text" data-i18n="price.steps.1.text"></p>
        </div>
      </li>
      <li class="pstep pstep--cap reveal" data-delay="3">
        <span class="pstep__node" aria-hidden="true"><b>3</b></span>
        <div class="pstep__body">
          <p class="pstep__label" data-i18n="price.steps.2.label"></p>
          <p class="pstep__amount" data-i18n="price.steps.2.amount"></p>
          <p class="pstep__text" data-i18n="price.steps.2.text"></p>
        </div>
      </li>
      <li class="pstep pstep--day2 reveal" data-delay="4">
        <span class="pstep__node" aria-hidden="true"><b>4</b></span>
        <div class="pstep__body">
          <p class="pstep__label" data-i18n="price.steps.3.label"></p>
          <p class="pstep__amount" data-i18n="price.steps.3.amount"></p>
          <p class="pstep__text" data-i18n="price.steps.3.text"></p>
        </div>
      </li>
      <li class="pstep pstep--max reveal" data-delay="5">
        <span class="pstep__node" aria-hidden="true"><b>5</b></span>
        <div class="pstep__body">
          <p class="pstep__label" data-i18n="price.steps.4.label"></p>
          <p class="pstep__amount" data-i18n="price.steps.4.amount"></p>
          <p class="pstep__text" data-i18n="price.steps.4.text"></p>
        </div>
      </li>
      </ol>
    </div>
    <p class="price__noapp reveal"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.500" width="10" height="19" rx="2.500"/><path d="M4 4l16 16"/></svg><span data-i18n="price.noApp"></span></p>
    <div class="total glass reveal reveal--scale">
      <div class="total__num" aria-hidden="true">₪200</div>
      <div class="total__copy">
        <h3 class="total__title" data-i18n="price.totalTitle"></h3>
        <p class="total__text" data-i18n="price.totalText"></p>
      </div>
    </div>
    <p class="price__foot reveal" data-i18n="price.footnote"></p>
  </div>
</section>
