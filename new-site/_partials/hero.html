<section class="hero" id="top" aria-labelledby="hero-title">
  <div class="hero__bg" aria-hidden="true">
    <img class="hero__club" src="assets/scenes/nightclub-ai.webp" alt="" width="1024" height="962" decoding="async" fetchpriority="low">
    <video class="hero__video" muted loop playsinline preload="none" poster="assets/video/festival-dark-poster.webp" tabindex="-1" data-src="assets/video/festival-dark.mp4"></video>
    <div class="hero__glow"></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
    <div class="hero__vignette"></div>
  </div>

  <div class="container hero__inner">
    <div class="hero__copy">
      <p class="hero__eyebrow reveal is-in"><span class="hero__dot" aria-hidden="true"></span><span data-i18n="hero.eyebrow">Power To Move</span></p>
      <h1 class="hero__title" id="hero-title">
        <span class="hero__l1 reveal is-in" data-delay="1" data-i18n="hero.titleLine1">ה-1% האחרון</span>
        <span class="hero__l2 text-grad reveal is-in" data-delay="2" data-i18n="hero.titleLine2">הוא שקרן</span>
      </h1>
      <p class="hero__sub reveal is-in" data-delay="3" data-i18n="hero.sub">סורקים, לוקחים מטען, ממשיכים עם החיים. מחזירים בכל עמדת FULLIN, בלי לרוץ אחרי שקע.</p>
      <div class="hero__cta reveal is-in" data-delay="4">
        <a class="btn btn--primary" id="hero-app" href="https://apps.apple.com/il/app/fullin/id6757767367?l=he" target="_blank" rel="noopener" data-ios="https://apps.apple.com/il/app/fullin/id6757767367?l=he" data-android="https://play.google.com/store/apps/details?id=com.fullin.app">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg>
          <span data-i18n="hero.ctaApp">להורדת האפליקציה</span>
        </a>
        <a class="btn btn--ghost" href="#contact" data-i18n="hero.ctaHost">רוצים עמדה בעסק?</a>
      </div>
      <ul class="hero__trust reveal is-in" data-delay="5" role="list">
        <li class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M8 9h2v2H8zM14 9h2v2h-2zM8 14h2v1H8zM13 13h3v3h-3z"/></svg><span data-i18n="hero.trust1">תשלום בסריקת QR</span></li>
        <li class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0113.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 01-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></svg><span data-i18n="hero.trust2">החזרה בכל עמדה</span></li>
        <li class="pill pill--free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="hero.trust3">שעה ראשונה חינם</span></li>
      </ul>

      <div class="bat reveal is-in" data-delay="6" id="bat" role="group" aria-label="טעינה" data-i18n-attr="aria-label:hero.batteryLabel" data-level="low">
        <div class="bat__top">
          <span class="bat__label" aria-hidden="true" data-i18n="hero.batteryLabel">טעינה</span>
          <span class="bat__num" aria-hidden="true" dir="ltr"><b id="bat-num">1</b><i>%</i></span>
        </div>
        <div class="bat__cell" aria-hidden="true" dir="ltr">
          <div class="bat__fill" id="bat-fill"></div>
          <svg class="bat__bolt" viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 2L5 13.5h5.3L9.3 22 19 9.8h-5.6z"/></svg>
        </div>
        <p class="bat__msg" id="bat-msg" aria-hidden="true">&nbsp;</p>
        <p class="sr-only" id="bat-live" aria-live="polite"></p>
      </div>
    </div>

    <div class="hero__stage" aria-hidden="true">
      <div class="stage__rings"><i></i><i></i><i></i></div>
      <div class="stage__disc"></div>
      <div class="px st24" data-depth="14"><div class="float" style="--fd:7s;--fy:-12px"><img src="assets/products/station-24.webp" alt="" width="1400" height="1866" fetchpriority="high" decoding="async"></div></div>
      <div class="px phone" data-depth="30"><div class="float" style="--fd:5.5s;--fy:-16px;--fdel:-1.5s"><img src="assets/products/phone-powerbank.webp" alt="" width="900" height="1600" decoding="async"></div></div>
      <div class="px st6" data-depth="22"><div class="float" style="--fd:6.2s;--fy:-14px;--fdel:-3s"><img src="assets/products/station-6.webp" alt="" width="1000" height="949" decoding="async"></div></div>
      <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
    </div>
  </div>

  <a class="hero__scroll" href="#how" aria-label="גללו להמשך" data-i18n-attr="aria-label:hero.scrollHint">
    <span class="hero__scroll-txt" data-i18n="hero.scrollHint">גללו להמשך</span>
    <span class="hero__mouse" aria-hidden="true"><i></i></span>
  </a>
</section>
