<section class="section pay-sec" id="pay" aria-labelledby="pay-title">
  <div class="glow-orb pay-sec__orb" aria-hidden="true"></div>
  <div class="container">
    <header class="section-head">
      <p class="eyebrow reveal" data-i18n="pay.eyebrow"></p>
      <h2 class="h-section reveal" data-delay="1" id="pay-title" tabindex="-1" data-i18n="pay.title"></h2>
      <p class="lead reveal" data-delay="2" data-i18n="pay.sub"></p>
    </header>

    <div class="pay-steps" data-pay-steps>
      <div class="pay-steps__track" aria-hidden="true"><i class="pay-steps__fill"></i></div>
      <ol class="pay-steps__list" role="list" tabindex="0" aria-labelledby="pay-title">
        <li class="pay-step reveal" data-delay="1">
          <span class="pay-step__ico" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V12a4 4 0 014-4h8M44 8h8a4 4 0 014 4v8M56 44v8a4 4 0 01-4 4h-8M20 56h-8a4 4 0 01-4-4v-8"/><rect x="18" y="18" width="12" height="12" rx="2"/><rect x="34" y="18" width="12" height="12" rx="2"/><rect x="18" y="34" width="12" height="12" rx="2"/><path d="M34 34h4v4h-4zM42 42h4v4h-4zM42 34h4M34 42h4"/><path class="pay-scan" d="M12 32h40" stroke="#E8F23A"/></svg></span>
          <span class="pay-step__n" aria-hidden="true">1</span>
          <h3 data-i18n="pay.steps.0.title"></h3>
          <p data-i18n="pay.steps.0.text"></p>
        </li>
        <li class="pay-step reveal" data-delay="2">
          <span class="pay-step__ico" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="12" width="48" height="40" rx="6"/><path d="M8 24h48"/><circle cx="16" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="22" cy="18" r="1.4" fill="currentColor" stroke="none"/><rect x="25" y="33" width="14" height="11" rx="2.500"/><path d="M28 33v-3a4 4 0 018 0v3" stroke="#E8F23A"/></svg></span>
          <span class="pay-step__n" aria-hidden="true">2</span>
          <h3 data-i18n="pay.steps.1.title"></h3>
          <p data-i18n="pay.steps.1.text"></p>
        </li>
        <li class="pay-step reveal" data-delay="3">
          <span class="pay-step__ico" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="16" width="52" height="34" rx="7"/><path d="M6 27h52M14 41h12"/><path d="M42 38l4 4 8-9" stroke="#E8F23A"/></svg></span>
          <span class="pay-step__n" aria-hidden="true">3</span>
          <h3 data-i18n="pay.steps.2.title"></h3>
          <p data-i18n="pay.steps.2.text"></p>
        </li>
        <li class="pay-step reveal" data-delay="4">
          <span class="pay-step__ico" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="20" width="44" height="26" rx="7"/><path d="M52 29h4a2 2 0 012 2v4a2 2 0 01-2 2h-4"/><path d="M33 24l-9 10h8l-3 8 10-11h-8z" fill="currentColor" stroke="none"/><path d="M14 54h28" stroke="#E8F23A" stroke-dasharray="2 6"/></svg></span>
          <span class="pay-step__n" aria-hidden="true">4</span>
          <h3 data-i18n="pay.steps.3.title"></h3>
          <p data-i18n="pay.steps.3.text"></p>
        </li>
      </ol>
    </div>

    <div class="pay-demo" data-pay-demo>
      <div class="pay-demo__stage">
        <div class="showcase__glow" aria-hidden="true"></div>
        <ol class="pay-phones" role="list" tabindex="0" aria-label="" data-i18n-attr="aria-label:pay.cap">
          <li class="pay-phone reveal">
            <figure class="shot__f">
              <div class="phone"><span class="phone__btn" aria-hidden="true"></span><div class="phone__screen"><img src="assets/pay/pay-page-v3.webp" width="520" height="1130" loading="lazy" decoding="async" alt="" data-i18n-attr="alt:pay.shots.0.alt"></div></div>
              <figcaption class="shot__cap"><span class="shot__n" aria-hidden="true">3</span><b data-i18n="pay.shots.0.title"></b><span data-i18n="pay.shots.0.text"></span></figcaption>
            </figure>
          </li>
          <li class="pay-phone reveal" data-delay="2">
            <figure class="shot__f">
              <div class="phone"><span class="phone__btn" aria-hidden="true"></span><div class="phone__screen phone__screen--short"><img src="assets/pay/pay-card-v3.webp" width="520" height="768" loading="lazy" decoding="async" alt="" data-i18n-attr="alt:pay.shots.1.alt"></div></div>
              <figcaption class="shot__cap"><span class="shot__n" aria-hidden="true">3</span><b data-i18n="pay.shots.1.title"></b><span data-i18n="pay.shots.1.text"></span></figcaption>
            </figure>
          </li>
        </ol>
        <p class="showcase__hint pay-demo__hint" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-i18n="pay.swipe"></span></p>
      </div>

      <aside class="pay-trust glass reveal" data-delay="2" aria-labelledby="pay-trust-title">
        <h3 id="pay-trust-title" data-i18n="pay.trust.title"></h3>
        <ul class="pay__chips" role="list">
          <li class="chip"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M16.4 12.7c0-2.4 2-3.5 2.1-3.6-1.1-1.700-2.900-1.900-3.500-1.900-1.500-.2-2.900.9-3.700.9-.8 0-1.900-.9-3.200-.8-1.600 0-3.100 1-4 2.400-1.700 3-.4 7.400 1.200 9.800.8 1.200 1.800 2.500 3 2.400 1.200 0 1.700-.8 3.200-.8 1.500 0 1.900.8 3.200.8 1.300 0 2.200-1.200 3-2.400.9-1.400 1.300-2.700 1.300-2.800-.1 0-2.600-1-2.600-4Zm-2.400-7c.7-.8 1.100-1.900 1-3-1 0-2.100.6-2.800 1.400-.6.700-1.200 1.800-1 2.900 1 .1 2.100-.5 2.800-1.300Z"/></svg><span lang="en">Apple Pay</span></li>
          <li class="chip"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M21.600 12.200c0-.7-.1-1.300-.2-1.900H12v3.700h5.400a4.600 4.600 0 0 1-2 3v2.500h3.200c1.900-1.700 3-4.300 3-7.300Z"/><path fill="#34A853" d="M12 22c2.700 0 5-.9 6.600-2.400l-3.200-2.500c-.9.600-2 1-3.400 1-2.600 0-4.800-1.800-5.600-4.100H3.100v2.600A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.400 14c-.2-.6-.3-1.300-.3-2s.1-1.400.3-2V7.400H3.100a10 10 0 0 0 0 9.200L6.400 14Z"/><path fill="#EA4335" d="M12 5.900c1.500 0 2.800.5 3.800 1.500l2.800-2.800A10 10 0 0 0 3.100 7.400L6.400 10c.8-2.300 3-4.100 5.600-4.100Z"/></svg><span lang="en">Google Pay</span></li>
          <li class="chip"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg><span data-i18n="pay.trust.card"></span></li>
        </ul>
        <ul class="pay-trust__list" role="list">
          <li><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.500"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span data-i18n="pay.trust.secure"></span></li>
          <li><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-6 8-6s8 2 8 6M4 4l16 16"/></svg><span data-i18n="pay.trust.noreg"></span></li>
          <li><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.500"/><path d="M11 18h2M4 4l16 16"/></svg><span data-i18n="pay.trust.noapp"></span></li>
        </ul>
        <p class="pay-trust__vs"><span data-i18n="pay.terminal"></span></p>
        <p class="pay-trust__vs"><span data-i18n="pay.vs.text"></span> <a href="#app" data-i18n="pay.vs.link"></a></p>
      </aside>
    </div>
  </div>
</section>
