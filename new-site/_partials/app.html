<section class="section app" id="app" aria-labelledby="app-title">
  <div class="glow-orb app__orb" aria-hidden="true"></div>
  <div class="container">
    <header class="section-head">
      <p class="eyebrow reveal" data-i18n="app.eyebrow"></p>
      <h2 class="h-section reveal" data-delay="1" id="app-title" tabindex="-1" data-i18n="app.title"></h2>
      <p class="lead reveal" data-delay="2" data-i18n="app.sub"></p>
    </header>

    <div class="app__grid">
      <figure class="app__stage reveal reveal--scale" data-app-stage>
        <div class="phone" aria-hidden="true">
          <div class="phone__notch"></div>
          <div class="phone__screen">
            <!-- 1. map + nearest station -->
            <div class="scr scr--map">
              <svg class="map" viewBox="0 0 270 560" preserveAspectRatio="xMidYMid slice" focusable="false">
                <rect width="270" height="560" fill="#E8F3EA"/>
                <path d="M-10 90 C60 70 120 130 190 100 S260 60 290 80 V-10 H-10Z" fill="#CFE8F2"/>
                <g fill="#fff" stroke="#fff" stroke-linecap="round">
                  <path d="M-10 250 C60 230 110 280 180 250 S250 220 290 240" fill="none" stroke-width="14"/>
                  <path d="M80 -10 C95 120 60 220 90 330 S120 470 110 580" fill="none" stroke-width="12"/>
                  <path d="M200 -10 C190 100 230 200 205 320 S210 470 230 580" fill="none" stroke-width="10"/>
                  <path d="M-10 410 L290 380" fill="none" stroke-width="9"/>
                  <path d="M-10 160 L290 190" fill="none" stroke-width="7"/>
                </g>
                <g fill="#D3E9D6"><rect x="112" y="268" width="62" height="44" rx="8"/><rect x="14" y="290" width="48" height="70" rx="8"/><rect x="220" y="400" width="40" height="50" rx="8"/></g>
              </svg>
              <span class="pin pin--a"><i></i></span>
              <span class="pin pin--b"><i></i></span>
              <span class="pin pin--c"><i></i></span>
              <span class="pin pin--main"><i></i></span>
              <span class="me"><i></i></span>
              <div class="topbar"><span class="topbar__logo">FULLIN</span><span class="topbar__chip">HE · EN · AR · RU</span></div>
              <div class="card">
                <div class="card__row">
                  <span class="card__ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span>
                  <span class="card__t"><b data-i18n="app.ui.nearest"></b><small data-i18n="app.ui.available"></small></span>
                  <span class="card__go"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
                </div>
                <span class="scanbtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg><span data-i18n="app.ui.scan"></span></span>
              </div>
            </div>
            <!-- 2. scanning -->
            <div class="scr scr--scan">
              <div class="vf"><i></i><i></i><i></i><i></i><span class="vf__line"></span>
                <svg viewBox="0 0 64 64" width="64" height="64" fill="#fff" opacity=".85"><path d="M6 6h20v20H6zM12 12v8h8v-8zM38 6h20v20H38zM44 12v8h8v-8zM6 38h20v20H6zM12 44v8h8v-8zM38 38h8v8h-8zM50 38h8v8h-8zM38 50h8v8h-8zM54 54h4v4h-4z"/></svg>
              </div>
              <p class="scr__hint" data-i18n="app.ui.scanning"></p>
            </div>
            <!-- 3. payment sheet -->
            <div class="scr scr--pay">
              <div class="sheet">
                <span class="sheet__grab"></span>
                <p class="sheet__t" data-i18n="app.ui.free"></p>
                <span class="applepay"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.4 12.7c0-2.4 2-3.5 2.1-3.6-1.1-1.700-2.900-1.900-3.500-1.900-1.500-.2-2.900.9-3.700.9-.8 0-1.900-.9-3.200-.8-1.600 0-3.100 1-4 2.400-1.700 3-.4 7.400 1.200 9.800.8 1.200 1.800 2.500 3 2.400 1.200 0 1.700-.8 3.200-.8 1.500 0 1.900.8 3.200.8 1.300 0 2.200-1.200 3-2.400.9-1.400 1.300-2.700 1.300-2.800-.1 0-2.600-1-2.600-4Zm-2.400-7c.7-.8 1.100-1.900 1-3-1 0-2.100.6-2.800 1.400-.6.700-1.200 1.800-1 2.900 1 .1 2.100-.5 2.800-1.300Z"/></svg><b>Pay</b><svg class="applepay__ok" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2FC353" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg></span>
                <p class="sheet__ok" data-i18n="app.ui.confirmed"></p>
              </div>
            </div>
            <!-- 4. released -->
            <div class="scr scr--done">
              <svg class="pb" viewBox="0 0 80 120" width="80" height="120" fill="none">
                <rect x="14" y="8" width="52" height="104" rx="14" fill="#0E1512"/>
                <rect x="20" y="14" width="40" height="92" rx="9" fill="#12281B"/>
                <path d="M42 34 30 62h9l-2 24 14-31h-9l2-21Z" fill="#E8F23A"/>
                <path d="M40 112v6" stroke="#E8F23A" stroke-width="4" stroke-linecap="round"/>
              </svg>
              <p class="scr__big" data-i18n="app.ui.released"></p>
              <p class="scr__hint" data-i18n="app.ui.take"></p>
            </div>
          </div>
        </div>
        <figcaption class="app__cap" data-i18n="app.ui.caption"></figcaption>
        <button type="button" class="app__pause" data-app-pause hidden aria-pressed="false" aria-label="" data-i18n-attr="aria-label:app.pause"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path class="ic-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/><path class="ic-play" d="M8 5v14l11-7z"/></svg></button>
      </figure>

      <div class="app__side">
        <ul class="feat" role="list">
          <li class="feat__i glass reveal" data-delay="1">
            <span class="feat__ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21Z"/><circle cx="12" cy="9.500" r="2.500"/></svg></span>
            <h3 data-i18n="app.features.0.title"></h3><p data-i18n="app.features.0.text"></p>
          </li>
          <li class="feat__i glass reveal" data-delay="2">
            <span class="feat__ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></span>
            <h3 data-i18n="app.features.1.title"></h3><p data-i18n="app.features.1.text"></p>
          </li>
          <li class="feat__i glass reveal" data-delay="3">
            <span class="feat__ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.500-6.200L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.500 6.200L3 16M3 21v-5h5"/></svg></span>
            <h3 data-i18n="app.features.2.title"></h3><p data-i18n="app.features.2.text"></p>
          </li>
          <li class="feat__i glass reveal" data-delay="4">
            <span class="feat__ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.200 3 14.800 0 18M12 3c-3 3.200-3 14.800 0 18"/></svg></span>
            <h3 data-i18n="app.features.3.title"></h3><p data-i18n="app.features.3.text"></p>
          </li>
        </ul>

        <div class="pay glass reveal reveal--scale">
          <h3 class="pay__title" data-i18n="app.pay.title"></h3>
          <ul class="pay__chips" role="list">
            <li class="chip"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M16.4 12.7c0-2.4 2-3.5 2.1-3.6-1.1-1.700-2.900-1.900-3.500-1.900-1.500-.2-2.900.9-3.700.9-.8 0-1.900-.9-3.200-.8-1.600 0-3.100 1-4 2.400-1.700 3-.4 7.400 1.200 9.800.8 1.200 1.800 2.500 3 2.400 1.200 0 1.700-.8 3.200-.8 1.500 0 1.900.8 3.200.8 1.300 0 2.200-1.200 3-2.400.9-1.400 1.300-2.700 1.300-2.800-.1 0-2.600-1-2.600-4Zm-2.400-7c.7-.8 1.100-1.900 1-3-1 0-2.100.6-2.800 1.400-.6.700-1.200 1.800-1 2.900 1 .1 2.100-.5 2.800-1.300Z"/></svg><span lang="en">Apple Pay</span></li>
            <li class="chip"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M21.600 12.200c0-.7-.1-1.300-.2-1.900H12v3.700h5.400a4.600 4.600 0 0 1-2 3v2.500h3.200c1.900-1.700 3-4.300 3-7.300Z"/><path fill="#34A853" d="M12 22c2.700 0 5-.9 6.600-2.400l-3.200-2.500c-.9.600-2 1-3.400 1-2.600 0-4.800-1.800-5.600-4.100H3.100v2.600A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.400 14c-.2-.6-.3-1.300-.3-2s.1-1.400.3-2V7.400H3.100a10 10 0 0 0 0 9.200L6.400 14Z"/><path fill="#EA4335" d="M12 5.900c1.500 0 2.800.5 3.800 1.500l2.800-2.800A10 10 0 0 0 3.100 7.400L6.400 10c.8-2.300 3-4.100 5.600-4.100Z"/></svg><span lang="en">Google Pay</span></li>
            <li class="chip"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg><span data-i18n="app.pay.card"></span></li>
          </ul>
          <p class="pay__text" data-i18n="app.pay.text"></p>
          <p class="pay__rates" data-i18n="app.pay.rates"></p>
        </div>

        <div class="dl reveal">
          <div class="dl__copy">
            <h3 data-i18n="app.dl.title"></h3>
            <p class="dl__note"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg><span data-i18n="app.dl.noapp"></span></p>
          </div>
          <div class="s-badges">
            <a class="s-badge-btn" href="https://apps.apple.com/il/app/fullin/id6757767367?l=he" target="_blank" rel="noopener" lang="en">
              <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor"><path d="M16.4 12.7c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.500-.2-2.900.9-3.700.9-.8 0-1.900-.9-3.200-.8-1.600 0-3.100 1-4 2.400-1.700 3-.4 7.400 1.200 9.800.8 1.200 1.800 2.500 3 2.400 1.200 0 1.700-.8 3.200-.8 1.500 0 1.900.8 3.200.8 1.300 0 2.200-1.200 3-2.400.9-1.400 1.300-2.700 1.300-2.800-.1 0-2.600-1-2.600-4Zm-2.400-7c.7-.8 1.100-1.900 1-3-1 0-2.100.6-2.800 1.400-.6.700-1.200 1.800-1 2.900 1 .1 2.100-.5 2.800-1.300Z"/></svg>
              <span class="s-badge-btn__t"><small dir="ltr">Download on the</small><b dir="ltr">App Store</b></span>
            </a>
            <a class="s-badge-btn" href="https://play.google.com/store/apps/details?id=com.fullin.app" target="_blank" rel="noopener" lang="en">
              <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="#2FC353" d="M3.600 2.500 13.500 12 3.600 21.500a1.600 1.600 0 0 1-.4-1.100V3.600c0-.4.100-.8.400-1.100Z"/><path fill="#E8F23A" d="m17 8.500-3.500 3.500L17 15.500l3.800-2.100c1.100-.7 1.100-2.200 0-2.800L17 8.500Z"/><path fill="#fff" d="M3.600 2.500c.4-.4 1-.5 1.600-.2L17 8.500 13.500 12 3.600 2.500Z"/><path fill="#8b9a93" d="M3.600 21.500 13.500 12 17 15.500 5.200 21.700c-.6.300-1.200.2-1.600-.2Z"/></svg>
              <span class="s-badge-btn__t"><small dir="ltr">GET IT ON</small><b dir="ltr">Google Play</b></span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
